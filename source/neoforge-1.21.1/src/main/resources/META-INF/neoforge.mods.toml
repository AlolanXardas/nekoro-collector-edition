modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
    modId = "nekorocollectoredition"
    version = "${version}"
    displayName = "Nekoro Collector Edition"
    authors = "Alolan Xardas"
    description = '''
A Collector Table for copying building blocks. Put a block in to add it to your collection (you keep it), convert blocks into points, and take copies of anything in your collection. Every player has their own collection. What can be added is set in the config.
'''

[[dependencies.nekorocollectoredition]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.nekorocollectoredition]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "nekorocollectoredition.mixins.json"
